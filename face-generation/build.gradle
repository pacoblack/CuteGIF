plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'de.undercouch.download'
}
apply from: "../common.gradle"

project.ext.ASSET_DIR = projectDir.toString() + '/src/main/assets'
apply from: 'download.gradle'

android {
  namespace 'com.cv.pic.face.generation'
  defaultConfig {
    ndk {
      abiFilters 'arm64-v8a' // 仅支持主流 ARM 架构
    }
  }
  aaptOptions {
    noCompress "tflite" // 防止模型被压缩
  }
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

  // MediaPipe核心库
  implementation 'com.google.mediapipe:tasks-vision-image-generator:0.10.14'

  implementation 'androidx.camera:camera-core:1.4.2'
  implementation "androidx.camera:camera-camera2:1.4.2" // 如果使用Camera2
  implementation "androidx.camera:camera-lifecycle:1.4.2" // 如果需要生命周期感知
  implementation "androidx.camera:camera-view:1.4.2" // 如果使用PreviewView
  implementation "androidx.camera:camera-video:1.4.2" // 如果需要录像功能
  // OpenCV用于图像变形（换脸必需）
//  implementation 'org.opencv:opencv:4.12.0'

}
